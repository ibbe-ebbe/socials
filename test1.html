<style>
:root{--bg:#07090f;--ink:#eef1f7;--mut:#8b95a8;--ice:#7dd3fc;--gold:#d4b26a;--line:rgba(255,255,255,.1)}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;min-height:100vh;color:var(--ink);font-family:Manrope,system-ui,sans-serif;overflow-x:hidden}
.bg{position:fixed;inset:0;z-index:-2;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:44px 44px;-webkit-mask-image:radial-gradient(ellipse at 50% 30%,#000 30%,transparent 75%);mask-image:radial-gradient(ellipse at 50% 30%,#000 30%,transparent 75%)}
.orbs{position:fixed;inset:0;z-index:-3;overflow:hidden;pointer-events:none}
.orb{position:absolute;border-radius:50%;will-change:transform}
.o1{width:520px;height:520px;top:-200px;left:-220px;background:radial-gradient(circle,rgba(29,78,216,.55),transparent 65%)}
.o2{width:480px;height:480px;bottom:-190px;right:-200px;background:radial-gradient(circle,rgba(14,116,144,.55),transparent 65%)}
.o3{width:380px;height:380px;top:45%;left:50%;background:radial-gradient(circle,rgba(138,109,47,.35),transparent 65%)}
.glow{position:fixed;top:0;left:0;width:520px;height:520px;margin:-260px 0 0 -260px;z-index:-1;pointer-events:none;background:radial-gradient(circle,rgba(125,211,252,.12),transparent 65%);will-change:transform;transform:translate3d(50vw,22vh,0)}
.w{max-width:520px;margin:0 auto;padding:56px 22px 72px;text-align:center}
.photo{position:relative;width:148px;height:148px;margin:0 auto;perspective:600px}
.photo::before{content:"";position:absolute;inset:-6px;border-radius:50%;background:conic-gradient(var(--ice),var(--gold),transparent 45%,var(--ice));will-change:transform}
.photo img{position:relative;width:100%;height:100%;border-radius:50%;object-fit:cover;border:5px solid var(--bg);display:block;will-change:transform}
h1{font-family:"Instrument Serif",Georgia,serif;font-weight:400;font-size:clamp(2.6rem,13vw,3.6rem);line-height:1;letter-spacing:-.01em;margin:34px 0 0}
h1 .ch{display:inline-block;white-space:pre}
.badge{width:22px;height:22px;vertical-align:super;margin-left:6px;fill:var(--ice)}
.role{height:1.6em;margin:14px 0 0;color:var(--ice);font-size:1rem;letter-spacing:.14em;text-transform:uppercase}
.caret{display:inline-block;width:2px;height:1em;background:var(--gold);margin-left:4px;vertical-align:-.15em}
.rule{height:1px;width:70%;margin:26px auto;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.ct{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.ct a{position:relative;overflow:hidden;color:var(--ink);text-decoration:none;font-size:.92rem;border:1px solid var(--line);border-radius:999px;padding:10px 18px;background:rgba(255,255,255,.04);transition:border-color .25s,transform .25s}
.ct a:hover{border-color:var(--gold);transform:translateY(-2px)}
.ct a::after{content:"";position:absolute;top:0;left:0;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.22),transparent);transform:translateX(-160%) skewX(-20deg)}
.l{margin-top:34px;display:grid;gap:12px;text-align:left}
.lk{position:relative;display:flex;align-items:center;gap:16px;padding:20px 22px;border:1px solid var(--line);border-radius:14px;background:rgba(18,24,36,.85);color:var(--ink);text-decoration:none;overflow:hidden;transition:border-color .3s,transform .3s}
.lk::before{content:"";position:absolute;inset:0;opacity:0;transition:opacity .3s;background:radial-gradient(240px circle at var(--mx,50%) var(--my,50%),rgba(125,211,252,.2),transparent 70%)}
.lk:hover,.lk:focus-visible{border-color:rgba(125,211,252,.6);transform:translateY(-3px)}
.lk:hover::before,.lk:focus-visible::before{opacity:1}
.n{font-size:.75rem;color:var(--gold);letter-spacing:.1em;position:relative}
.t{font-family:"Instrument Serif",Georgia,serif;font-size:1.7rem;position:relative}
.h{margin-left:auto;color:var(--mut);font-size:.85rem;position:relative}
.ar{position:relative;color:var(--ice);transition:transform .3s}
.lk:hover .ar{transform:translate(4px,-4px)}
h2{font-family:"Instrument Serif",Georgia,serif;font-weight:400;font-style:italic;font-size:1.5rem;margin:46px 0 12px}
.feed{border:1px solid var(--line);border-radius:14px;padding:10px;background:rgba(18,24,36,.85);min-height:180px;overflow:hidden}
.feed iframe{display:block;width:100%;max-width:480px;height:160px;border:0;margin:0 auto}
.tt blockquote{margin:0 auto;max-width:780px;min-width:288px}.tt a{color:var(--ice)}
:focus-visible{outline:2px solid var(--ice);outline-offset:3px}
@media(prefers-reduced-motion:no-preference){
@keyframes rise{from{opacity:0;transform:translateY(24px)}}
@keyframes chr{from{opacity:0;transform:translateY(60%) rotateX(70deg)}}
@keyframes draw{from{transform:scaleX(0);opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{50%{opacity:0}}
@keyframes sweep{0%,70%{transform:translateX(-160%) skewX(-20deg)}100%{transform:translateX(420%) skewX(-20deg)}}
@keyframes d1{50%{transform:translate(90px,70px) scale(1.2)}}
@keyframes d2{50%{transform:translate(-80px,-90px) scale(1.15)}}
@keyframes d3{50%{transform:translate(-60px,50px) scale(.8)}}
.o1{animation:d1 16s ease-in-out infinite}.o2{animation:d2 19s ease-in-out infinite}.o3{animation:d3 14s ease-in-out infinite}
.photo{animation:rise 1s both}.photo::before{animation:spin 6s linear infinite}
h1 .ch{animation:chr .8s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(.2s + var(--i)*40ms)}
.badge{animation:rise .8s .9s both}
.role{animation:rise .8s .6s both}.caret{animation:blink 1s steps(1) infinite}
.rule{animation:draw 1s .8s both}
.ct a{animation:rise .8s both}.ct a:nth-child(1){animation-delay:.9s}.ct a:nth-child(2){animation-delay:1s}
.ct a::after{animation:sweep 4.5s ease-in-out 2s infinite}
.lk{animation:rise .7s both}.lk:nth-child(1){animation-delay:1.05s}.lk:nth-child(2){animation-delay:1.15s}.lk:nth-child(3){animation-delay:1.25s}.lk:nth-child(4){animation-delay:1.35s}}
</style></head>
<body>

<main class="w">

  <p class="role" id="role">IT Professional · Digital Strategist · Graphic Designer</p>
  <div class="rule"></div>
  <div class="ct"><a href="tel:+9609735659">+960 9735659</a><a href="mailto:i@eehaab.com">i@eehaab.com</a></div>
  <nav class="l">
    <a class="lk" href="https://instagram.com/ibbe.ebbe" target="_blank" rel="noopener"><span class="n">01</span><span class="t">Instagram</span><span class="h">@ibbe.ebbe</span><span class="ar">↗</span></a>
    <a class="lk" href="https://m.facebook.com/ibbe.ebbe/" target="_blank" rel="noopener"><span class="n">02</span><span class="t">Facebook</span><span class="h">ibbe.ebbe</span><span class="ar">↗</span></a>
    <a class="lk" href="https://tiktok.com/@ibbe.ebbe" target="_blank" rel="noopener"><span class="n">03</span><span class="t">TikTok</span><span class="h">@ibbe.ebbe</span><span class="ar">↗</span></a>
    <a class="lk" href="https://soundcloud.com/ibbe_ebbe" target="_blank" rel="noopener"><span class="n">04</span><span class="t">SoundCloud</span><span class="h">ibbe_ebbe</span><span class="ar">↗</span></a>
  </nav>
  <h2>Instagram Feed</h2>
  <div class="feed" id="igBox"><iframe data-src="https://snapwidget.com/embed/1099099" scrolling="no" allowtransparency="true" title="Posts from Instagram"></iframe></div>

      <section><a target="_blank" rel="noopener" href="https://www.tiktok.com/@ibbe.ebbe?refer=creator_embed">@ibbe.ebbe on TikTok</a></section>

</main>
<script>
(function(){
  var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  /* name letters */
  var h=document.getElementById('name'),badge=h.querySelector('.badge'),txt='Ibrahim Eehaab';
  h.textContent='';
  for(var i=0;i<txt.length;i++){var s=document.createElement('span');s.className='ch';s.setAttribute('aria-hidden','true');s.style.setProperty('--i',i);s.textContent=txt[i];h.appendChild(s)}
  h.appendChild(badge);
  /* lazy embeds: load only when near the viewport */
  function loadIG(){var f=document.querySelector('#igBox iframe');if(f&&!f.src)f.src=f.dataset.src}
  var ttDone=false;
  function loadTT(){if(ttDone)return;ttDone=true;var sc=document.createElement('script');sc.async=true;sc.src='https://www.tiktok.com/embed.js';document.body.appendChild(sc)}
  if('IntersectionObserver' in window){
    var io=new IntersectionObserver(function(es){es.forEach(function(e){
      if(!e.isIntersecting)return;
      if(e.target.id==='igBox')loadIG();else loadTT();
      io.unobserve(e.target);
    })},{rootMargin:'250px'});
    io.observe(document.getElementById('igBox'));io.observe(document.getElementById('ttBox'));
  }else{addEventListener('load',function(){loadIG();loadTT()})}
  if(reduce)return;
  /* role typewriter */
  var role=document.getElementById('role');
  var words=['IT Professional','Digital Strategist','Graphic Designer'],w=0,c=0,del=false;
  role.innerHTML='<span id="tx"></span><span class="caret"></span>';
  var tx=document.getElementById('tx');
  (function tick(){
    var cur=words[w];tx.textContent=cur.slice(0,c);
    if(!del&&c<cur.length){c++;return setTimeout(tick,70)}
    if(!del){del=true;return setTimeout(tick,1500)}
    if(c>0){c--;return setTimeout(tick,35)}
    del=false;w=(w+1)%words.length;setTimeout(tick,300);
  })();
  /* cursor glow + photo tilt (fine pointers only, rAF-throttled) */
  if(matchMedia('(pointer:fine)').matches){
    var glow=document.getElementById('glow'),img=document.querySelector('.photo img'),px=0,py=0,busy=false;
    addEventListener('pointermove',function(e){
      px=e.clientX;py=e.clientY;if(busy)return;busy=true;
      requestAnimationFrame(function(){
        glow.style.transform='translate3d('+px+'px,'+py+'px,0)';
        img.style.transform='rotateY('+((px/innerWidth-.5)*20)+'deg) rotateX('+(-(py/innerHeight-.5)*20)+'deg)';
        busy=false;
      });
    },{passive:true});
    document.querySelectorAll('.lk').forEach(function(a){
      a.addEventListener('pointermove',function(e){
        var r=a.getBoundingClientRect();
        a.style.setProperty('--mx',(e.clientX-r.left)+'px');a.style.setProperty('--my',(e.clientY-r.top)+'px');
      },{passive:true});
    });
  }
})();
</script>
